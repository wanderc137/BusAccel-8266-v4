<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Arquitectura del nodo BusAccel-8266-v4</title>
  <desc id="archDesc">Diagrama de bloques del firmware: sensor ADXL345 por I2C, muestreo a 100 Hz, anillo de 100 muestras, maquina de estados, ventana de captura de 2 segundos, compuerta de publicacion en 0,58 g, broker MQTT y salida serie.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f85149"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#58a6ff"/>

  <text x="48" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e6edf3">BusAccel-8266-v4 · arquitectura del nodo</text>
  <text x="48" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">ESP8266 + ADXL345 · muestreo 100 Hz · deteccion en Z · ventana de 2 s · publicacion condicional</text>

  <!-- ===================== SENSOR ===================== -->
  <rect x="48" y="150" width="220" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="48" y="150" width="5" height="200" rx="2.5" fill="#39c5cf"/>
  <text x="70" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#39c5cf">GY-291</text>
  <text x="70" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">ADXL345 · 3 ejes</text>
  <text x="70" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">rango +-2 g · 256 LSB/g</text>
  <text x="70" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">I2C 0x53 · 100 Hz</text>
  <text x="70" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">resolucion 3,9 mg/LSB</text>
  <text x="70" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#58a6ff">SDA -&gt; D2 (GPIO4)</text>
  <text x="70" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#58a6ff">SCL -&gt; D1 (GPIO5)</text>
  <text x="70" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#d29922">VCC 3V3 · GND comun</text>

  <line x1="268" y1="250" x2="384" y2="250" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="326" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#58a6ff">I2C</text>
  <text x="326" y="270" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">0x53</text>

  <!-- ===================== MCU ===================== -->
  <rect x="392" y="120" width="500" height="480" rx="12" fill="#0f1620" stroke="#30363d" stroke-width="1.5"/>
  <text x="414" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e6edf3">NodeMCU ESP8266 (ESP-12E)</text>
  <text x="414" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">loop() prioriza el muestreo; la red avanza sin bloquear</text>

  <!-- bloque 1 -->
  <rect x="412" y="196" width="460" height="56" rx="7" fill="#161b22" stroke="#21262d"/>
  <rect x="412" y="196" width="4" height="56" rx="2" fill="#58a6ff"/>
  <text x="432" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">1 · Muestreo ~100 Hz</text>
  <text x="432" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">SAMPLE_INTERVAL_MS = 10 · burst I2C de 6 bytes · g = raw / 256</text>

  <!-- bloque 2 -->
  <rect x="412" y="268" width="460" height="56" rx="7" fill="#161b22" stroke="#21262d"/>
  <rect x="412" y="268" width="4" height="56" rx="2" fill="#39c5cf"/>
  <text x="432" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">2 · preRing[100]</text>
  <text x="432" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">anillo del pasado siempre rodando · 100 muestras · 800 B</text>

  <!-- bloque 3 -->
  <rect x="412" y="340" width="460" height="56" rx="7" fill="#161b22" stroke="#21262d"/>
  <rect x="412" y="340" width="4" height="56" rx="2" fill="#d29922"/>
  <text x="432" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">3 · FSM IDLE / LOCKED</text>
  <text x="432" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">|devZ| &gt; 0,20 g · lockout 250 ms · reposo 50 ms · sin solape</text>

  <!-- bloque 4 -->
  <rect x="412" y="412" width="460" height="56" rx="7" fill="#161b22" stroke="#21262d"/>
  <rect x="412" y="412" width="4" height="56" rx="2" fill="#bc8cff"/>
  <text x="432" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">4 · Ventana 100 + 100</text>
  <text x="432" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">pico = max |devZ| · 2 s · escaneo inicial + actualizacion en linea</text>

  <!-- bloque 5 -->
  <rect x="412" y="484" width="460" height="56" rx="7" fill="#161b22" stroke="#21262d"/>
  <rect x="412" y="484" width="4" height="56" rx="2" fill="#f85149"/>
  <text x="432" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">5 · Compuerta MQTT</text>
  <text x="432" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">publica solo si el pico &gt; 0,58 g (estricto)</text>

  <text x="414" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6e7681">WDT 8 s · contador en RTC (magic EVT1) · comando RECAL recalibra el setpoint</text>

  <!-- ===================== WIFI ===================== -->
  <line x1="892" y1="250" x2="940" y2="250" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="916" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#3fb950">WiFi</text>
  <text x="916" y="270" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">STA</text>

  <!-- ===================== BROKER ===================== -->
  <rect x="948" y="150" width="204" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="948" y="150" width="5" height="300" rx="2.5" fill="#bc8cff"/>
  <text x="968" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#bc8cff">Broker MQTT</text>
  <text x="968" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">autoriza por Client ID</text>

  <text x="968" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#3fb950">&lt;id&gt;/report/online</text>
  <text x="968" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">"true" · cada 30 s</text>

  <text x="968" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#3fb950">&lt;id&gt;/report/value</text>
  <text x="968" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">"0.62" · texto plano</text>

  <text x="968" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#bc8cff">&lt;id&gt;/directive/...</text>
  <text x="968" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8b949e">RECAL · recalibra</text>

  <text x="968" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6e7681">sin NTP: la hora la pone</text>
  <text x="968" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6e7681">el receptor del mensaje</text>

  <line x1="948" y1="430" x2="900" y2="430" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="924" y="421" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#f85149">RECAL</text>

  <!-- ===================== SERIE ===================== -->
  <rect x="48" y="430" width="220" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="48" y="430" width="5" height="170" rx="2.5" fill="#3fb950"/>
  <text x="70" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3fb950">Serie 115200</text>
  <text x="70" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">una linea por evento</text>
  <rect x="70" y="494" width="176" height="40" rx="6" fill="#0b0f14" stroke="#21262d"/>
  <text x="84" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#e6edf3">0.62</text>
  <text x="70" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">arranque 100 % silencioso:</text>
  <text x="70" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">nada hasta el primer golpe</text>

  <line x1="392" y1="520" x2="276" y2="520" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="334" y="512" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#3fb950">printf</text>

  <!-- ===================== BANNER ===================== -->
  <rect x="48" y="646" width="1104" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="70" y="672" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e6edf3">Flujo de un golpe</text>
  <text x="70" y="696" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">muestra -&gt; devZ = gz - spZ -&gt; evento si |devZ| &gt; 0,20 g -&gt; pico en 2 s -&gt; serie siempre -&gt; MQTT solo si pico &gt; 0,58 g</text>

  <text x="1152" y="744" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#484f58">BusAccel-8266-v4 · docs/assets/architecture.svg</text>
</svg>
