<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="pinTitle pinDesc">
  <title id="pinTitle">Pinout y cableado del nodo BusAccel-8266-v4</title>
  <desc id="pinDesc">Vista superior de la NodeMCU ESP8266 con el nombre de todos los pads y el cableado minimo al modulo GY-291 ADXL345: 3V3 a VCC, GND a GND, D2 GPIO4 a SDA y D1 GPIO5 a SCL.</desc>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="url(#pbg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#3fb950"/>

  <text x="48" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">Pinout · NodeMCU ESP8266 + GY-291</text>
  <text x="48" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Vista superior (lado componentes). Solo cuatro cables: 3V3, GND, SDA y SCL.</text>

  <!-- ================= PLACA ================= -->
  <rect x="140" y="120" width="320" height="580" rx="12" fill="#0f1720" stroke="#30363d" stroke-width="1.5"/>

  <!-- antena -->
  <polyline points="168,148 168,132 186,132 186,148 204,148 204,132 222,132 222,148 240,148" fill="none" stroke="#6e7681" stroke-width="2"/>

  <!-- USB -->
  <rect x="255" y="108" width="90" height="28" rx="4" fill="#30363d" stroke="#484f58"/>
  <text x="300" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6e7681">micro-USB</text>

  <!-- modulo -->
  <rect x="185" y="190" width="230" height="150" rx="5" fill="#1b2430" stroke="#484f58"/>
  <text x="300" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#8b949e">ESP-12E</text>
  <text x="300" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6e7681">ESP8266EX · 80/160 MHz</text>
  <text x="300" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6e7681">WiFi 2,4 GHz · 4 MB flash</text>

  <text x="300" y="376" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#58a6ff">NodeMCU</text>
  <text x="300" y="396" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6e7681">DevKit · 3,3 V</text>

  <circle cx="300" cy="432" r="4" fill="#1f6feb" opacity="0.7"/>
  <text x="300" y="454" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6e7681">LED de placa (no usado)</text>

  <text x="300" y="678" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#484f58">vista superior · lado componentes</text>

  <!-- pines izquierda -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <line x1="118" y1="170" x2="140" y2="170" stroke="#484f58"/><circle cx="129" cy="170" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="174" text-anchor="end" fill="#8b949e">A0</text>
    <line x1="118" y1="204" x2="140" y2="204" stroke="#484f58"/><circle cx="129" cy="204" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="208" text-anchor="end" fill="#6e7681">RSV</text>
    <line x1="118" y1="239" x2="140" y2="239" stroke="#484f58"/><circle cx="129" cy="239" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="243" text-anchor="end" fill="#6e7681">RSV</text>
    <line x1="118" y1="273" x2="140" y2="273" stroke="#484f58"/><circle cx="129" cy="273" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="277" text-anchor="end" fill="#6e7681">SD3</text>
    <line x1="118" y1="308" x2="140" y2="308" stroke="#484f58"/><circle cx="129" cy="308" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="312" text-anchor="end" fill="#6e7681">SD2</text>
    <line x1="118" y1="342" x2="140" y2="342" stroke="#484f58"/><circle cx="129" cy="342" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="346" text-anchor="end" fill="#6e7681">SD1</text>
    <line x1="118" y1="377" x2="140" y2="377" stroke="#484f58"/><circle cx="129" cy="377" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="381" text-anchor="end" fill="#6e7681">CMD</text>
    <line x1="118" y1="411" x2="140" y2="411" stroke="#484f58"/><circle cx="129" cy="411" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="415" text-anchor="end" fill="#6e7681">SD0</text>
    <line x1="118" y1="446" x2="140" y2="446" stroke="#484f58"/><circle cx="129" cy="446" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="450" text-anchor="end" fill="#6e7681">CLK</text>
    <line x1="118" y1="480" x2="140" y2="480" stroke="#8b949e"/><circle cx="129" cy="480" r="3.5" fill="#30363d" stroke="#8b949e"/><text x="112" y="484" text-anchor="end" fill="#8b949e">GND</text>
    <line x1="118" y1="515" x2="140" y2="515" stroke="#f85149"/><circle cx="129" cy="515" r="3.5" fill="#f85149" stroke="#f85149"/><text x="112" y="519" text-anchor="end" fill="#f85149">3V3</text>
    <line x1="118" y1="549" x2="140" y2="549" stroke="#484f58"/><circle cx="129" cy="549" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="553" text-anchor="end" fill="#6e7681">EN</text>
    <line x1="118" y1="584" x2="140" y2="584" stroke="#484f58"/><circle cx="129" cy="584" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="588" text-anchor="end" fill="#6e7681">RST</text>
    <line x1="118" y1="618" x2="140" y2="618" stroke="#8b949e"/><circle cx="129" cy="618" r="3.5" fill="#30363d" stroke="#8b949e"/><text x="112" y="622" text-anchor="end" fill="#8b949e">GND</text>
    <line x1="118" y1="653" x2="140" y2="653" stroke="#484f58"/><circle cx="129" cy="653" r="3.5" fill="#21262d" stroke="#484f58"/><text x="112" y="657" text-anchor="end" fill="#6e7681">VIN</text>
  </g>

  <!-- pines derecha -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <line x1="460" y1="170" x2="482" y2="170" stroke="#484f58"/><circle cx="471" cy="170" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="174" fill="#6e7681">D0</text>
    <line x1="460" y1="204" x2="482" y2="204" stroke="#d29922"/><circle cx="471" cy="204" r="4.5" fill="#d29922" stroke="#d29922"/><text x="490" y="208" fill="#d29922" font-weight="700">D1 · GPIO5</text>
    <line x1="460" y1="239" x2="482" y2="239" stroke="#58a6ff"/><circle cx="471" cy="239" r="4.5" fill="#58a6ff" stroke="#58a6ff"/><text x="490" y="243" fill="#58a6ff" font-weight="700">D2 · GPIO4</text>
    <line x1="460" y1="273" x2="482" y2="273" stroke="#484f58"/><circle cx="471" cy="273" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="277" fill="#6e7681">D3 · GPIO0</text>
    <line x1="460" y1="308" x2="482" y2="308" stroke="#484f58"/><circle cx="471" cy="308" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="312" fill="#6e7681">D4 · GPIO2</text>
    <line x1="460" y1="342" x2="482" y2="342" stroke="#f85149"/><circle cx="471" cy="342" r="4.5" fill="#f85149" stroke="#f85149"/><text x="490" y="346" fill="#f85149" font-weight="700">3V3</text>
    <line x1="460" y1="377" x2="482" y2="377" stroke="#8b949e"/><circle cx="471" cy="377" r="4.5" fill="#8b949e" stroke="#8b949e"/><text x="490" y="381" fill="#8b949e" font-weight="700">GND</text>
    <line x1="460" y1="411" x2="482" y2="411" stroke="#484f58"/><circle cx="471" cy="411" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="415" fill="#6e7681">D5 · GPIO14</text>
    <line x1="460" y1="446" x2="482" y2="446" stroke="#484f58"/><circle cx="471" cy="446" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="450" fill="#6e7681">D6 · GPIO12</text>
    <line x1="460" y1="480" x2="482" y2="480" stroke="#484f58"/><circle cx="471" cy="480" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="484" fill="#6e7681">D7 · GPIO13</text>
    <line x1="460" y1="515" x2="482" y2="515" stroke="#484f58"/><circle cx="471" cy="515" r="3.5" fill="#21262d" stroke="#484f58"/><text x="490" y="519" fill="#6e7681">D8 · GPIO15</text>
    <line x1="460" y1="549" x2="482" y2="549" stroke="#3fb950"/><circle cx="471" cy="549" r="4" fill="#3fb950" stroke="#3fb950"/><text x="490" y="553" fill="#3fb950">RX · GPIO3</text>
    <line x1="460" y1="584" x2="482" y2="584" stroke="#3fb950"/><circle cx="471" cy="584" r="4" fill="#3fb950" stroke="#3fb950"/><text x="490" y="588" fill="#3fb950">TX · GPIO1</text>
    <line x1="460" y1="618" x2="482" y2="618" stroke="#8b949e"/><circle cx="471" cy="618" r="3.5" fill="#30363d" stroke="#8b949e"/><text x="490" y="622" fill="#8b949e">GND</text>
    <line x1="460" y1="653" x2="482" y2="653" stroke="#f85149"/><circle cx="471" cy="653" r="3.5" fill="#30363d" stroke="#f85149"/><text x="490" y="657" fill="#f85149">3V3</text>
  </g>

  <!-- ================= PANEL ================= -->
  <rect x="620" y="120" width="532" height="580" rx="12" fill="#101820" stroke="#30363d" stroke-width="1.5"/>
  <text x="644" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e6edf3">CABLEADO MÍNIMO AL GY-291</text>
  <text x="644" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">cuatro cables · sin resistencias externas (pull-up en el modulo)</text>

  <!-- filas -->
  <rect x="644" y="200" width="18" height="18" rx="3" fill="#f85149"/>
  <text x="676" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">3V3</text>
  <text x="750" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">→</text>
  <text x="778" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f85149">VCC</text>
  <text x="880" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">3,3 V · nunca 5 V</text>

  <rect x="644" y="240" width="18" height="18" rx="3" fill="#8b949e"/>
  <text x="676" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">GND</text>
  <text x="750" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">→</text>
  <text x="778" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8b949e">GND</text>
  <text x="880" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">referencia comun</text>

  <rect x="644" y="280" width="18" height="18" rx="3" fill="#58a6ff"/>
  <text x="676" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">D2 · GPIO4</text>
  <text x="750" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">→</text>
  <text x="778" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#58a6ff">SDA</text>
  <text x="880" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">datos I2C</text>

  <rect x="644" y="320" width="18" height="18" rx="3" fill="#d29922"/>
  <text x="676" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">D1 · GPIO5</text>
  <text x="750" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">→</text>
  <text x="778" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#d29922">SCL</text>
  <text x="880" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">reloj I2C</text>

  <!-- aviso -->
  <rect x="644" y="362" width="484" height="56" rx="6" fill="#2d1215" stroke="#f85149" stroke-width="1"/>
  <text x="660" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#f85149">NUNCA 5 V</text>
  <text x="660" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#e6edf3">La NodeMCU y el ADXL345 trabajan a 3,3 V. 5 V en VCC puede dañar el modulo.</text>

  <!-- nota pines -->
  <text x="644" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#58a6ff">OJO CON LAS ETIQUETAS</text>
  <text x="644" y="472" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">D1 y D2 no son los pines A1/A2 de un Arduino UNO. En la NodeMCU:</text>
  <text x="644" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">D1 = GPIO5 (SCL) y D2 = GPIO4 (SDA). El sketch fija Wire.begin(4, 5).</text>
  <text x="644" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">D3 (GPIO0) y D4 (GPIO2) tienen funciones de arranque: no usarlos.</text>

  <!-- tabla -->
  <line x1="644" y1="528" x2="1128" y2="528" stroke="#30363d"/>
  <text x="644" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#6e7681">PIN</text>
  <text x="724" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#6e7681">GPIO</text>
  <text x="812" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#6e7681">USO EN ESTE PROYECTO</text>
  <text x="1040" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#6e7681">ESTADO</text>
  <line x1="644" y1="556" x2="1128" y2="556" stroke="#21262d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
    <text x="644" y="576" fill="#d29922">D1</text><text x="724" y="576" fill="#8b949e">GPIO5</text><text x="812" y="576" fill="#e6edf3">SCL del ADXL345</text><text x="1040" y="576" fill="#f85149">ocupado</text>
    <text x="644" y="594" fill="#58a6ff">D2</text><text x="724" y="594" fill="#8b949e">GPIO4</text><text x="812" y="594" fill="#e6edf3">SDA del ADXL345</text><text x="1040" y="594" fill="#f85149">ocupado</text>
    <text x="644" y="612" fill="#f85149">3V3</text><text x="724" y="612" fill="#8b949e">—</text><text x="812" y="612" fill="#e6edf3">VCC del GY-291</text><text x="1040" y="612" fill="#f85149">ocupado</text>
    <text x="644" y="630" fill="#8b949e">GND</text><text x="724" y="630" fill="#8b949e">—</text><text x="812" y="630" fill="#e6edf3">referencia comun</text><text x="1040" y="630" fill="#f85149">ocupado</text>
    <text x="644" y="648" fill="#3fb950">TX</text><text x="724" y="648" fill="#8b949e">GPIO1</text><text x="812" y="648" fill="#e6edf3">UART 115200 baud</text><text x="1040" y="648" fill="#d29922">reservado</text>
    <text x="644" y="666" fill="#3fb950">RX</text><text x="724" y="666" fill="#8b949e">GPIO3</text><text x="812" y="666" fill="#e6edf3">UART 115200 baud</text><text x="1040" y="666" fill="#d29922">reservado</text>
    <text x="644" y="684" fill="#6e7681">D5–D8</text><text x="724" y="684" fill="#8b949e">GPIO14…15</text><text x="812" y="684" fill="#6e7681">no usados</text><text x="1040" y="684" fill="#3fb950">libres</text>
  </g>

  <text x="1152" y="744" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#484f58">BusAccel-8266-v4 · docs/assets/pinout.svg</text>
</svg>
